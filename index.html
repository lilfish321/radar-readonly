<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷达镜像 · readonly</title>
</head>
<body style="margin:0;background:#0d1117;color:#c9d1d9;font-family:'Segoe UI','Microsoft YaHei',sans-serif">
<div style="padding:12px 14px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:baseline">
  <span style="font-weight:800;font-size:15px">📡 雷达镜像 <span style="font-size:10px;color:#8b949e">readonly v1.3 · 只读·Gist单通道</span></span>
  <span id="clock" style="font-size:11px;color:#8b949e"></span>
</div>

<div style="padding:10px 14px">
  <div style="font-size:11px;color:#ffd166;margin-bottom:6px">📊 指数</div>
  <div id="idx" style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px"><span style="color:#566178">加载中…</span></div>
</div>

<div style="padding:10px 14px;border-top:1px solid #21262d">
  <div style="font-size:11px;color:#ffd166;margin-bottom:6px">🔥 题材热度·实时（概念板块涨幅Top15）</div>
  <div id="theme" style="font-size:12px"><span style="color:#566178">加载中…</span></div>
</div>

<div style="padding:10px 14px;border-top:1px solid #21262d">
  <div style="font-size:11px;color:#ffd166;margin-bottom:6px">🚨 涨停哨兵（实时涨停池）</div>
  <div id="zt" style="font-size:12px"><span style="color:#566178">加载中…</span></div>
</div>

<div style="padding:10px 14px;border-top:1px solid #21262d;margin-bottom:20px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:11px;color:#58a6ff">💼 模拟盘账本（云同步·只读）</span>
    <span id="snapTs" style="font-size:10px;color:#566178"></span>
  </div>
  <div id="acct"><span style="color:#566178">未配置：点下方按钮输入 Gist ID（首次一次即可）</span></div>
  <div style="margin-top:8px;display:flex;gap:8px">
    <button onclick="cfgGist()" style="background:#1f6feb22;border:1px solid #1f6feb;color:#58a6ff;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:11px">⚙️ 配置 Gist ID</button>
    <button onclick="loadAcct(true)" style="background:#1f6feb22;border:1px solid #30363d;color:#c9d1d9;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:11px">↻ 立即刷新</button>
  </div>
</div>

<div id="err" style="position:fixed;bottom:0;left:0;right:0;padding:4px 14px;background:#2d1215;color:#ff8a9a;font-size:10px;display:none"></div>

<script>
/* 雷达readonly镜像 v1.2 (10.15) — 全源JSONP化(CORS免疫) + ×100整数格式归一 + 失败态显形
   v1.2修复: ①指数点位×100乱码(腾讯部分节点返回整数,比值法pct仍对,点位归一)
             ②题材热度/哨兵裸fetch被CORS拦→永久"加载中"→改JSONP+失败显形(不再空catch吞掉)
             ③快照时间戳UTC标注修正 */
var $=function(id){ return document.getElementById(id); };
function err(msg){ var e=$('err'); e.style.display=msg?'block':'none'; e.textContent=msg||''; }
setInterval(function(){ $('clock').textContent=new Date().toTimeString().slice(0,8); },1000);

/* ---- 通用JSONP(CORS免疫·8秒超时·失败回调null) ---- */
var _jpN=0;
function jsonp(url,cb,timeoutMs){
  var name='_roJp'+(++_jpN);
  var done=false;
  window[name]=function(data){ if(done)return; done=true; cleanup(); cb(data); };
  var s=document.createElement('script');
  var to=setTimeout(function(){ if(done)return; done=true; cleanup(); cb(null); }, timeoutMs||8000);
  function cleanup(){ clearTimeout(to); try{ delete window[name]; }catch(e){ window[name]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
  s.onerror=function(){ if(done)return; done=true; cleanup(); cb(null); };
  s.src=url+'&cb='+name+'&_='+Date.now();
  document.head.appendChild(s);
}

/* ---- 指数(腾讯JSONP·×100归一) ---- */
function loadIdx(){
  jsonp('https://qt.gtimg.cn/q=sh000001,sz399001,sz399006,sh000688&r=',function(){
    var out=[], any=false;
    ['v_sh000001','v_sz399001','v_sz399006','v_sh000688'].forEach(function(k){
      var raw=window[k]; if(!raw) return;
      var f=String(raw).split('~'); if(!f[3]||f[3]==='0.00') return;
      var px=parseFloat(f[3]), pc=parseFloat(f[4]);
      if(!isFinite(px)||!isFinite(pc)||!pc) return;
      /* v1.2: 整数格式归一 — 部分节点返回×100整数(370946), 比值pct本就对, 点位除回 */
      if(px>100000){ px/=100; pc/=100; }
      var pct=(px/pc-1)*100;
      any=true;
      out.push('<span style="min-width:118px;display:inline-block">'+f[1]+' <b style="color:'+(pct>=0?'#ff5a5a':'#3ddc84')+'">'+(pct>0?'+':'')+pct.toFixed(2)+'%</b> <span style="color:#8b949e;font-size:11px">'+px.toFixed(2)+'</span></span>');
    });
    if(any){ $('idx').innerHTML=out.join(''); roStat('idx',true); err(''); }
    else roStat('idx',false);
  });
}

/* ---- 题材实时榜(东财clist JSONP) ---- */
function loadTheme(){
  jsonp('https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=15&po=1&fid=f3&fs=m:90+t:3&fields=f3,f14,f128',function(d){
    if(!d||!d.data||!d.data.diff||!d.data.diff.length){ roStat('theme',false); $('theme').innerHTML='<span style="color:#ff8a9a">✗ 东财板块接口不可达 · 30s自动重试</span>'; return; }
    var rows=d.data.diff;
    roStat('theme',true);
    $('theme').innerHTML=rows.map(function(t,ix){
      var hot=ix<3, pct=t.f3;
      if(pct!=null&&Math.abs(pct)>20) pct/=100; /* v1.2: ×100防御 */
      return '<div style="display:flex;padding:3px 0;border-bottom:1px solid #161b22">'+(hot?'<span style="color:#ff6b6b;margin-right:5px">🔥</span>':'<span style="margin-right:9px"></span>')
        +'<span style="color:'+(hot?'#ffd166':'#8ab4ff')+';font-weight:600;min-width:100px">'+t.f14+'</span>'
        +'<span style="color:'+((pct||0)>=0?'#ff5a5a':'#3ddc84')+';min-width:60px">'+(pct!=null?pct.toFixed(2)+'%':'—')+'</span>'
        +'<span style="color:#8b949e;font-size:11px;flex:1">领涨 '+((t.f128||'—')+'').slice(0,12)+'</span></div>';
    }).join('');
  });
}

/* ---- 涨停哨兵(push2ex JSONP·已实测支持cb) ---- */
function loadZt(){
  var d0=new Date(), _p2=function(x){ return ('0'+x).slice(-2); };
  var ds=d0.getFullYear()+'-'+_p2(d0.getMonth()+1)+'-'+_p2(d0.getDate());
  jsonp('https://push2ex.eastmoney.com/getTopicZTPool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=320&sort=fbt%3Aasc&date='+ds.replace(/-/g,''),function(j){
    var pool=(j&&j.data&&j.data.pool)||[];
    if(!pool.length){ roStat('zt',false); $('zt').innerHTML='<span style="color:#ff8a9a">✗ 涨停池接口不可达 · 60s自动重试</span>'; return; }
    pool.sort(function(a,b){ return ((b.zttj&&b.zttj.days)||0)-((a.zttj&&a.zttj.days)||0); });
    roStat('zt',true);
    $('zt').innerHTML='<div style="margin-bottom:4px"><b style="color:#ff5a5a">涨停 '+pool.length+'</b> <span style="color:#8b949e">（ZT池口径·连板降序·全量见主版）</span></div>'
      +pool.slice(0,40).map(function(o){ var lb=(o.zttj&&o.zttj.days)||1; return '<span style="display:inline-block;margin:1px 6px 1px 0;font-size:11px;color:'+(lb>=2?'#ffd166':'#ffb4b4')+'">'+o.n+(lb>=2?'['+lb+'板]':'')+'</span>'; }).join('');
  });
}

/* ---- 账本(Gist只读) ---- */
function gistId(){ return localStorage.getItem('ro_gist_id')||''; }
function cfgGist(){
  var v=prompt('输入主端云通道的 Gist ID（32位hex，主版⚙️建立通道时弹窗显示）\n仅存本机浏览器，不上传任何地方：',gistId());
  if(v!==null){ localStorage.setItem('ro_gist_id',v.trim()); loadAcct(true); }
}
function loadAcct(manual){
  var id=gistId(); if(!id){ if(manual) alert('先配置 Gist ID'); return; }
  fetch('https://api.github.com/gists/'+id)
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(g){
    var f=g.files&&g.files['sim_snapshot.json']; if(!f) throw new Error('快照文件不存在');
    var s=JSON.parse(f.content);
    $('snapTs').textContent='数据截至 '+s.ts.replace('T',' ').slice(0,16)+' UTC';
    var mv=0; for(var c in (s.pos||{})){ var p=s.pos[c]; mv+=(p._px||p.cost)*p.shares; }
    var total=(s.cash||0)+mv, acc=total-(s.cap||1e6), accPct=acc/(s.cap||1e6)*100;
    var html='<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:6px">'
      +'<span>总资产 <b>¥'+Math.round(total).toLocaleString()+'</b></span>'
      +'<span style="color:'+(acc>=0?'#ff5a5a':'#3ddc84')+'">累计 '+(acc>=0?'+':'')+'¥'+Math.abs(Math.round(acc)).toLocaleString()+' ('+(acc>=0?'+':'')+accPct.toFixed(2)+'%)</span>'
      +'<span>现金 ¥'+Math.round(s.cash||0).toLocaleString()+'</span></div>';
    html+='<div style="font-size:12px">';
    for(var c in (s.pos||{})){ var p=s.pos[c];
      var px=p._px||p.cost, pnl=(px-p.cost)/p.cost*100;
      html+='<div style="padding:3px 0;border-bottom:1px solid #161b22"><b style="color:#ffd23e">'+(p.name||c)+'</b> '+p.shares+'股 @'+p.cost.toFixed(2)
        +' → '+px.toFixed(2)+' <span style="color:'+(pnl>=0?'#ff5a5a':'#3ddc84')+'">'+(pnl>=0?'+':'')+pnl.toFixed(2)+'%</span>'
        +(p.buydate?' <span style="color:#566178;font-size:10px">'+p.buydate+'建仓</span>':'')+'</div>';
    }
    if(!Object.keys(s.pos||{}).length) html+='<div style="color:#566178;padding:3px 0">空仓</div>';
    html+='</div>';
    if(s.locked&&s.locked.orders&&s.locked.orders.length){
      html+='<div style="margin-top:6px;font-size:11px;color:#8b949e">📋 决策单('+s.locked.date+')：'+s.locked.orders.map(function(o){ return o.name+'['+o.mode+']'; }).join(' ')+'</div>';
    }
    if((s.trades||[]).length){
      html+='<div style="margin-top:6px;font-size:11px;color:#8b949e">'+s.trades.slice(-3).map(function(t){ var d=new Date(t.ts); return t.act+' '+t.n+' '+t.shares+'股'; }).join(' · ')+'</div>';
    }
    $('acct').innerHTML=html;
    _roSnap=snap; renderZtFromSnap(); renderThemeFromSnap();
    err('');
  }).catch(function(e){ $('acct').innerHTML='<span style="color:#ff8a9a">拉取失败: '+e.message+'</span>'; });
}

var _roSnap=null;
function renderZtFromSnap(){ var el=$('zt'); if(!_roSnap||!_roSnap.zt){ el.innerHTML='<span style="color:#566178">等待主端推送涨停池…</span>'; return; }
  var zt=_roSnap.zt||[];
  var h='<div style="font-size:11px;color:#8b949e;margin-bottom:4px">涨停 '+zt.length+'只 · 主端 '+(_roSnap.tm||'—')+' 推送</div>';
  zt.slice(0,10).forEach(function(o){ h+='<span style="display:inline-block;margin:1px 6px 1px 0;font-size:12px"><b style="color:#ff7b72">'+(o.n||o.c)+'</b><span style="color:#8b949e">'+(o.lbc||1)+'板'+(o.zbc?('·'+o.zbc+'开'):'')+'</span></span>'; });
  el.innerHTML=h;
}
function renderThemeFromSnap(){ var el=$('theme'); if(!_roSnap||!_roSnap.theme||!_roSnap.theme.length){ el.innerHTML='<span style="color:#566178">等待主端推送题材榜…</span>'; return; }
  var h='';
  _roSnap.theme.forEach(function(t,ix){ var hot=ix<3;
    h+='<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:12px;border-bottom:1px solid #161b22"><span>'+(hot?'🔥 ':'')+ (t.f14||'—')+'</span><span style="color:'+(parseFloat(t.f3)>0?'#3fb950':'#ff7b72')+'">'+(t.f3!=null?parseFloat(t.f3).toFixed(2)+'%':'—')+'</span><span style="color:#8b949e;font-size:10px;flex:1;text-align:right">领涨 '+(t.f128||'—')+'</span></div>';
  });
  el.innerHTML=h;
}
/* ---- 调度 ---- */
loadIdx(); renderThemeFromSnap(); renderZtFromSnap(); if(gistId()) loadAcct(false);
setInterval(loadIdx,15000);

setInterval(function(){ if(gistId()) loadAcct(false); },120000);
</script>
</body>
</html>
